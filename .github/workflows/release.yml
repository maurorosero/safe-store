# SPDX-License-Identifier: MIT
# En HA el release es el tag: el Marketplace instala desde ahí y el add-on
# publica su imagen. Antes de publicar se verifica que el tag sea un merge de
# main y que la versión del manifest coincida, para que lo instalado no mienta
# sobre lo que contiene.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guarda:
    name: guarda del tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: tag en main, merge commit y versión coherente
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${TAG}^{commit}" origin/main; then
            echo "el tag ${TAG} no está en main: no se publica." >&2
            exit 1
          fi
          padres="$(git rev-list --parents -n 1 "${TAG}^{commit}" | wc -w)"
          if [ "${padres}" -ne 3 ]; then
            echo "el tag va sobre el merge del pull request a main." >&2
            exit 1
          fi
          manifest="$(python -c "import json;print(json.load(open('custom_components/safe_store/manifest.json'))['version'])")"
          if [ "${manifest}" != "${version}" ]; then
            echo "manifest.json dice ${manifest} y el tag es ${version}." >&2
            exit 1
          fi
          addon="$(sed -n 's/^version: *"\(.*\)"/\1/p' secrets_unlocker/config.yaml | head -1)"
          if [ "${addon}" != "${version}" ]; then
            echo "el add-on dice ${addon} y el tag es ${version}." >&2
            exit 1
          fi
          echo "tag ${TAG} coherente con manifest y add-on"

  imagen:
    name: imagen del add-on
    needs: guarda
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build y push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: secrets_unlocker
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_FROM=python:3.12-alpine
          tags: |
            ghcr.io/${{ github.repository_owner }}/safe-store-unlocker:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/safe-store-unlocker:latest

  release:
    name: release
    needs: imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: la sección del changelog existe
        run: |
          test -f ".changes/release-${GITHUB_REF_NAME#v}.md" || {
            echo "falta .changes/release-${GITHUB_REF_NAME#v}.md: correr tools/changelog.sh prepare ${GITHUB_REF_NAME#v}" >&2
            exit 1
          }
      - name: empaquetar el componente para el Marketplace
        run: |
          cd custom_components && zip -r "../safe_store-${GITHUB_REF_NAME}.zip" safe_store
      - name: publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "safe_store-${GITHUB_REF_NAME}.zip" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file ".changes/release-${GITHUB_REF_NAME#v}.md" \
            --verify-tag
