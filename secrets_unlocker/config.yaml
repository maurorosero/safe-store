# SPDX-License-Identifier: MIT
name: Safe Store Unlocker
version: "0.2.16"
slug: secrets_unlocker
hostname: secrets-unlocker
description: Hands the Safe Store master key to Home Assistant over the local network
url: https://github.com/maurorosero/safe-store
arch:
  - amd64
  - aarch64
startup: initialize
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_title: Safe Store
panel_icon: mdi:shield-key
map:
  - type: homeassistant_config
    read_only: true
backup: cold
backup_exclude:
  - master.key
  - age.key
options:
  master_key: ""
schema:
  master_key: password
